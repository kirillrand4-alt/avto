# Пример: отдать веб-панель на подпути parsercompressor.online/avto,
# НЕ трогая остальные проекты. Вставь этот location в существующий server {}
# блок для parsercompressor.online.
#
# Важно: proxy_pass БЕЗ завершающего "/" — тогда префикс /avto сохраняется и
# приложение (оно само смонтировано на /avto) получает правильные пути.

location /avto/ {
    proxy_pass http://127.0.0.1:8090;     # порт из .env (PORT). Поставь свой свободный.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# чтобы вход без слэша тоже работал
location = /avto {
    return 301 /avto/;
}
