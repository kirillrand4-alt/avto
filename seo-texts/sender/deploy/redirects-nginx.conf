# Сгенерировано tools/gen_redirects_nginx.py из config/domains.json — руками не править.
# 301-редиректы доменов-двойников на основные сайты (КЦ/Meyer).
#
# Порядок ввода:
# 1. A-записи всех доменов (и www) из реестра → IP этого сервера. MX не трогать!
# 2. mkdir -p /var/www/acme && положить этот файл в /etc/nginx/conf.d/redirects.conf
#    (секцию server 443 ниже СНАЧАЛА закомментировать), nginx -t && systemctl reload nginx
# 3. Выпустить один мультидоменный сертификат:
# certbot certonly --webroot -w /var/www/acme \
#   -d compressor-pro-systems.ru \
#   -d www.compressor-pro-systems.ru \
#   -d kompressor-trade.ru \
#   -d www.kompressor-trade.ru \
#   -d rentgen-detektor.ru \
#   -d www.rentgen-detektor.ru \
#   -d kompressor-air-trade.ru \
#   -d www.kompressor-air-trade.ru \
#   -d kompressor-pro-expert.ru \
#   -d www.kompressor-pro-expert.ru \
#   -d kompressor-air-expert.ru \
#   -d www.kompressor-air-expert.ru \
#   -d sort-inspection.ru \
#   -d www.sort-inspection.ru \
#   -d compressor-air-expert.ru \
#   -d www.compressor-air-expert.ru \
#   -d optic-sort.ru \
#   -d www.optic-sort.ru \
#   -d zernosort.ru \
#   -d www.zernosort.ru \
#   -d kompressor-expert.ru \
#   -d www.kompressor-expert.ru \
#   -d kompressor-pro-trade.ru \
#   -d www.kompressor-pro-trade.ru \
#   -d sort-systems.ru \
#   -d www.sort-systems.ru \
#   -d compressor-store.ru \
#   -d www.compressor-store.ru
# 4. Раскомментировать server 443, nginx -t && systemctl reload nginx.
# 5. Продление: certbot renew --deploy-hook "systemctl reload nginx" (таймер ставится сам).
# 6. Проверка: python3 sender/tools/check_domains.py — колонка редиректов должна позеленеть.

map $host $redirect_target {
    default prokompressor.ru;
    ~^(www\.)?compressor-pro-systems\.ru$ prokompressor.ru;
    ~^(www\.)?kompressor-trade\.ru$ prokompressor.ru;
    ~^(www\.)?rentgen-detektor\.ru$ meyer-corp.ru;
    ~^(www\.)?kompressor-air-trade\.ru$ prokompressor.ru;
    ~^(www\.)?kompressor-pro-expert\.ru$ prokompressor.ru;
    ~^(www\.)?kompressor-air-expert\.ru$ prokompressor.ru;
    ~^(www\.)?sort-inspection\.ru$ vsefotoseparatory.ru;
    ~^(www\.)?compressor-air-expert\.ru$ prokompressor.ru;
    ~^(www\.)?optic-sort\.ru$ vsefotoseparatory.ru;
    ~^(www\.)?zernosort\.ru$ vsefotoseparatory.ru;
    ~^(www\.)?kompressor-expert\.ru$ prokompressor.ru;
    ~^(www\.)?kompressor-pro-trade\.ru$ prokompressor.ru;
    ~^(www\.)?sort-systems\.ru$ vsefotoseparatory.ru;
    ~^(www\.)?compressor-store\.ru$ prokompressor.ru;
}

server {
    listen 80;
    listen [::]:80;
    server_name compressor-pro-systems.ru www.compressor-pro-systems.ru kompressor-trade.ru www.kompressor-trade.ru rentgen-detektor.ru www.rentgen-detektor.ru kompressor-air-trade.ru www.kompressor-air-trade.ru kompressor-pro-expert.ru www.kompressor-pro-expert.ru kompressor-air-expert.ru www.kompressor-air-expert.ru sort-inspection.ru www.sort-inspection.ru compressor-air-expert.ru www.compressor-air-expert.ru optic-sort.ru www.optic-sort.ru zernosort.ru www.zernosort.ru kompressor-expert.ru www.kompressor-expert.ru kompressor-pro-trade.ru www.kompressor-pro-trade.ru sort-systems.ru www.sort-systems.ru compressor-store.ru www.compressor-store.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$redirect_target$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name compressor-pro-systems.ru www.compressor-pro-systems.ru kompressor-trade.ru www.kompressor-trade.ru rentgen-detektor.ru www.rentgen-detektor.ru kompressor-air-trade.ru www.kompressor-air-trade.ru kompressor-pro-expert.ru www.kompressor-pro-expert.ru kompressor-air-expert.ru www.kompressor-air-expert.ru sort-inspection.ru www.sort-inspection.ru compressor-air-expert.ru www.compressor-air-expert.ru optic-sort.ru www.optic-sort.ru zernosort.ru www.zernosort.ru kompressor-expert.ru www.kompressor-expert.ru kompressor-pro-trade.ru www.kompressor-pro-trade.ru sort-systems.ru www.sort-systems.ru compressor-store.ru www.compressor-store.ru;

    ssl_certificate     /etc/letsencrypt/live/compressor-pro-systems.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compressor-pro-systems.ru/privkey.pem;

    return 301 https://$redirect_target$request_uri;
}
