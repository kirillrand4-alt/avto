# nginx-панель «Руспром-сендер» — TLS-терминация + статика SPA + прокси /api.
#
# Топология (рекомендуемая, Linux):
#   [браузер] --443/TLS--> [nginx] --+--> статика web/dist (SPA)
#                                    +--/api/*--> http://127.0.0.1:8090 (serve-api, API в корне)
#
# serve-api при этой топологии запускается БЕЗ --static-dir (только API, роуты в корне);
# nginx срезает префикс /api трейлинг-слэшем в proxy_pass (см. ниже) — так же, как
# dev-прокси Vite (rewrite ^/api → ''). Статику отдаёт nginx напрямую (быстрее uvicorn).
#
# Установка:
#   1) заменить panel.example.ru на реальный домен;
#   2) выпустить сертификат: certbot --nginx -d panel.example.ru   (или см. блок ACME ниже);
#   3) положить сюда: /etc/nginx/sites-available/rusprom-panel.conf
#      ln -s ../sites-available/rusprom-panel.conf /etc/nginx/sites-enabled/
#   4) nginx -t && systemctl reload nginx
#
# Панель — внутренний инструмент для 28 продажников; ограничьте доступ по IP/VPN
# (см. блок allow/deny) — публично торчать ей незачем.

# --- HTTP: редирект на HTTPS + ACME http-01 challenge ---
server {
    listen 80;
    listen [::]:80;
    server_name panel.example.ru;

    # оставляем открытым только ACME-челлендж (обновление сертификата certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: сайт панели ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.ru;

    # TLS (пути certbot; замените под свой ЦС при необходимости)
    ssl_certificate     /etc/letsencrypt/live/panel.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS (только после того, как убедились, что HTTPS стабилен)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # безопасность (панель управляет рассылкой — не индексировать, не встраивать)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # доступ только из офисной сети/VPN (раскомментируйте и впишите свои диапазоны)
    # allow 203.0.113.0/24;   # офис
    # allow 10.8.0.0/24;      # VPN
    # deny all;

    root /opt/rusprom-sender/seo-texts/sender/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 12m;   # запас под будущий импорт CSV через панель

    # хэшированные ассеты (index-XXXX.js/.css) — иммутабельны, кэш надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API → serve-api (в корне). Трейлинг-слэш в proxy_pass срезает префикс /api:
    #   /api/leads → http://127.0.0.1:8090/leads
    location /api/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # DNS-чек домена ходит в сеть — даём ему время
        proxy_connect_timeout 10s;
    }

    # health backend'а (не кэшировать)
    location = /api/health {
        proxy_pass http://127.0.0.1:8090/health;
        access_log off;
    }

    # SPA client-side routing: любой прочий путь → index.html (перезагрузка на
    # /campaigns/5 не должна давать 404)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
